<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lembretes recebidos · Testes</title><style>body{font:16px system-ui;background:#eef3f2;color:#18352f;max-width:1000px;margin:40px auto;padding:20px}article,form{background:white;border:1px solid #cadbd3;border-radius:12px;padding:20px;margin:16px 0}button,input{font:inherit;padding:10px;border-radius:6px;border:1px solid #bad0c4}button{background:#176b53;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#547169}</style>
<a href="/">Voltar ao simulador</a><h1>Lembretes recebidos</h1><p>Este servidor recebe chamadas em <code>POST /api/lembretes</code>. Os registros abaixo são atualizados a cada dois segundos.</p>
<form id="run"><label>Chave da API do agente <input id="key" type="password"></label> <button>Processar atendimentos inativos</button></form><p id="status" role="status"></p><div id="logs"></div>
<script src="/config.js"></script><script>
const $=id=>document.getElementById(id);
async function refresh(){try{const r=await fetch('/api/logs');if(!r.ok)throw Error('Falha ao carregar registros');const data=await r.json();$('logs').replaceChildren();for(const item of data){const card=document.createElement('article');const title=document.createElement('h3');title.textContent=`Conversa ${item.payload.conversa_id} · tentativa ${item.payload.tentativa}`;const time=document.createElement('small');time.textContent=item.recebido_em+' UTC';const content=document.createElement('pre');content.textContent=JSON.stringify(item.payload,null,2);card.append(title,time,content);$('logs').append(card)}if(!data.length)$('logs').textContent='Nenhum lembrete recebido ainda.'}catch(e){$('status').textContent=e.message}}
$('run').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch(window.API_BASE_URL.replace(/\/$/,'')+'/api/atendimentos/processar-inativos',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':$('key').value},body:JSON.stringify({limite:50})});const data=await r.json();$('status').textContent=r.ok?`Enviados: ${data.enviados}. Cancelados: ${data.cancelados}. Falhas: ${data.falhas}.`:JSON.stringify(data.detail);await refresh()}catch(e){$('status').textContent=e.message}finally{button.disabled=false}};
refresh();setInterval(refresh,2000);
</script></html>
